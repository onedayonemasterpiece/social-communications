name: Apply canonical events-bot VK contract 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vk-events-bot-contract-20260807.yml

permissions:
  contents: write

concurrency:
  group: apply-vk-events-bot-contract-20260807
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply migration
        run: python scripts/apply_vk_events_bot_contract_20260807.py

      - name: Run contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'telethon==1.40.0' 'requests==2.32.5'
          python -m py_compile \
            scripts/social_registry.py \
            scripts/telegram_publish.py \
            scripts/vk_publish.py \
            scripts/vk_events_bot_contract.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Commit permanent code and remove one-off files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name onedayonemasterpiece
          git config user.email estershow6@gmail.com
          git rm -f \
            .github/workflows/apply-vk-events-bot-contract-20260807.yml \
            .github/workflows/vk-postponed-diagnostic-20260807.yml \
            .github/workflows/inspect-events-bot-vk-canonical-20260807.yml \
            scripts/apply_vk_events_bot_contract_20260807.py
          git add \
            scripts/vk_publish.py \
            scripts/vk_events_bot_contract.py \
            tests/test_social_publish_contracts.py \
            docs/telegram-vk-automation.md \
            README.md
          git commit -m 'Reuse canonical events-bot VK postponed identity contract'
          git push origin HEAD:main
