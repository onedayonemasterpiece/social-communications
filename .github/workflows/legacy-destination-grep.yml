name: Legacy destination mapping probe

on:
  push:
    branches: [main]
    paths:
      - .github/legacy-destination-grep-trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Clone legacy public repository
        run: git clone --depth 1 --filter=blob:none https://github.com/onedayonemasterpiece/events-bot-new.git legacy
      - name: Find exact Uh ty Kaliningrad mappings
        shell: bash
        run: |
          set -euo pipefail
          cd legacy
          echo 'UH_TY_MAPPING_START'
          grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='package-lock.json' \
            'Ух ты, Калининград|uhtykaliningrad|238875824' . \
            | head -n 400 || true
          echo 'UH_TY_MAPPING_END'
