name: MAX destination inspect

on:
  push:
    branches: [main]
    paths:
      - .github/max-stage-inspect-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MAX_SESSION: ${{ secrets.MAX_SESSION }}
      MAX_DESTINATION_QUERY: тестовая група
      MAX_ARTIFACT_DIR: artifacts/max-stage-inspect
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Inspect destination candidates without opening or sending
        run: node scripts/max-stage-inspect.mjs
      - name: Upload short-lived diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-stage-inspect-${{ github.run_id }}
          path: artifacts/max-stage-inspect
          if-no-files-found: error
          retention-days: 1
