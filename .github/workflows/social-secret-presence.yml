name: Social credential presence probe

on:
  push:
    branches: [main]
    paths:
      - .github/social-secret-presence-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MAX_SESSION: ${{ secrets.MAX_SESSION }}
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      VK_ACCESS_TOKEN5: ${{ secrets.VK_ACCESS_TOKEN5 }}
    steps:
      - name: Verify minimal credential contract without printing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            MAX_SESSION \
            TELEGRAM_AUTH_BUNDLE_GH_ACTIONS \
            VK_ACCESS_TOKEN5; do
            if [[ -n "${!name:-}" ]]; then
              printf 'SOCIAL_SECRET_PRESENT=%s\n' "$name"
            else
              printf 'SOCIAL_SECRET_ABSENT=%s\n' "$name"
              missing=1
            fi
          done
          exit "$missing"
