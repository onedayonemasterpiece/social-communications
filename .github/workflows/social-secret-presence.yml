name: Social credential readiness

on:
  push:
    branches: [main]
    paths:
      - .github/social-secret-presence-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      MAX_SESSION: ${{ secrets.MAX_SESSION }}
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      VK_ACCESS_TOKEN5: ${{ secrets.VK_ACCESS_TOKEN5 }}
    steps:
      - name: Verify minimal credentials without printing values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          failed = False
          for name in ("MAX_SESSION", "TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", "VK_ACCESS_TOKEN5"):
              present = bool(os.environ.get(name))
              print(f"SOCIAL_SECRET_{'PRESENT' if present else 'ABSENT'}={name}")
              failed = failed or not present

          raw = os.environ.get("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", "").strip()
          bundle = None
          if raw:
              attempts = [raw]
              for decoder in (base64.urlsafe_b64decode, base64.b64decode):
                  try:
                      padded = raw + ("=" * (-len(raw) % 4))
                      attempts.append(decoder(padded.encode("ascii")).decode("utf-8"))
                  except Exception:
                      pass
              for candidate in attempts:
                  try:
                      parsed = json.loads(candidate)
                  except Exception:
                      continue
                  if isinstance(parsed, dict):
                      bundle = parsed
                      break

          def find(payload, names):
              if not isinstance(payload, dict):
                  return None
              lowered = {str(key).casefold(): value for key, value in payload.items()}
              for name in names:
                  if name.casefold() in lowered:
                      return lowered[name.casefold()]
              for value in payload.values():
                  if isinstance(value, dict):
                      nested = find(value, names)
                      if nested not in (None, ""):
                          return nested
              return None

          fields = {
              "api_id": find(bundle, ("api_id", "apiId", "telegram_api_id", "tg_api_id")),
              "api_hash": find(bundle, ("api_hash", "apiHash", "telegram_api_hash", "tg_api_hash")),
              "session": find(bundle, ("session", "session_string", "string_session", "telegram_session")),
          }
          for field, value in fields.items():
              present = value not in (None, "")
              print(f"TELEGRAM_BUNDLE_FIELD_{'PRESENT' if present else 'ABSENT'}={field}")
              failed = failed or not present

          if failed:
              print("::error title=Social credentials not ready::One or more minimal credentials or Telegram bundle fields are absent.")
              sys.exit(1)
          print("SOCIAL_CREDENTIAL_READINESS=ready")
          PY
