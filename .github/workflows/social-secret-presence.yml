name: Social credential presence probe

on:
  push:
    branches: [main]
    paths:
      - .github/social-secret-presence-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
      TG_SESSION_BASE64: ${{ secrets.TG_SESSION_BASE64 }}
      TELEGRAM_AUTH_BUNDLE_E2E: ${{ secrets.TELEGRAM_AUTH_BUNDLE_E2E }}
      TELEGRAM_AUTH_BUNDLE: ${{ secrets.TELEGRAM_AUTH_BUNDLE }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      KPSK_TELETHON_SESSION: ${{ secrets.KPSK_TELETHON_SESSION }}
      VK_TOKEN: ${{ secrets.VK_TOKEN }}
      VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
      VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
      VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
      VK_API_TOKEN: ${{ secrets.VK_API_TOKEN }}
      VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
      VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
      VK_EVENTS_GROUP_ID: ${{ secrets.VK_EVENTS_GROUP_ID }}
      VK_AFISHA_GROUP_ID: ${{ secrets.VK_AFISHA_GROUP_ID }}
    steps:
      - name: Print presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            TG_API_ID TG_API_HASH TG_SESSION_STRING TG_SESSION_BASE64 \
            TELEGRAM_AUTH_BUNDLE_E2E TELEGRAM_AUTH_BUNDLE TELEGRAM_SESSION \
            TELEGRAM_API_ID TELEGRAM_API_HASH KPSK_TELETHON_SESSION \
            VK_TOKEN VK_USER_TOKEN VK_GROUP_TOKEN VK_ACCESS_TOKEN VK_API_TOKEN VK_SERVICE_TOKEN \
            VK_GROUP_ID VK_EVENTS_GROUP_ID VK_AFISHA_GROUP_ID; do
            if [[ -n "${!name:-}" ]]; then
              printf 'SOCIAL_SECRET_PRESENT=%s\n' "$name"
            else
              printf 'SOCIAL_SECRET_ABSENT=%s\n' "$name"
            fi
          done
