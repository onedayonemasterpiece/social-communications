name: VK postponed visibility diagnostic 2026-08-07

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/vk-postponed-diagnostic-20260807.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      VK_ACCESS_TOKEN5: ${{ secrets.VK_ACCESS_TOKEN5 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect current VK server state without content or token values
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'requests==2.32.5'
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          import requests

          TOKEN = (os.environ.get('VK_ACCESS_TOKEN5') or '').strip()
          if not TOKEN:
              raise SystemExit('VK_ACCESS_TOKEN5 is absent')

          API = 'https://api.vk.com/method'
          VERSION = '5.199'
          GROUP_ID = 231828790
          POST_ID = 1631
          MARKER = 'SC-20260807-2100'

          session = requests.Session()
          session.headers['User-Agent'] = 'social-communications-vk-diagnostic/1.0'

          def call(method, **params):
              response = session.post(
                  f'{API}/{method}',
                  data={**params, 'access_token': TOKEN, 'v': VERSION},
                  timeout=(10, 40),
              )
              payload = response.json()
              if 'error' in payload:
                  error = payload['error'] or {}
                  print(f"VK_DIAG_API_ERROR={method}:code={error.get('error_code')}:message={error.get('error_msg')}")
                  return None
              return payload.get('response')

          def items(response):
              if isinstance(response, dict):
                  value = response.get('items')
                  return value if isinstance(value, list) else []
              return response if isinstance(response, list) else []

          def summarize(post):
              text = str(post.get('text') or '')
              ts = int(post.get('date') or post.get('publish_date') or 0)
              utc = datetime.fromtimestamp(ts, timezone.utc).isoformat() if ts else None
              local = datetime.fromtimestamp(ts, ZoneInfo('Europe/Kaliningrad')).isoformat() if ts else None
              return {
                  'id': int(post.get('id') or 0),
                  'owner_id': int(post.get('owner_id') or 0),
                  'from_id': int(post.get('from_id') or 0),
                  'created_by': int(post.get('created_by') or 0),
                  'date_epoch': ts,
                  'date_utc': utc,
                  'date_kaliningrad': local,
                  'post_type': post.get('post_type'),
                  'is_pinned': int(post.get('is_pinned') or 0),
                  'marked_as_ads': int(post.get('marked_as_ads') or 0),
                  'marker_present': MARKER in text,
                  'text_len': len(text),
                  'text_sha256_12': hashlib.sha256(text.encode('utf-8')).hexdigest()[:12],
                  'attachment_types': [
                      str(item.get('type') or '')
                      for item in (post.get('attachments') or [])
                      if isinstance(item, dict)
                  ],
              }

          server_time = call('utils.getServerTime')
          print(f'VK_DIAG_SERVER_TIME_EPOCH={server_time}')
          if isinstance(server_time, int):
              print('VK_DIAG_SERVER_TIME_UTC=' + datetime.fromtimestamp(server_time, timezone.utc).isoformat())
              print('VK_DIAG_SERVER_TIME_KALININGRAD=' + datetime.fromtimestamp(server_time, ZoneInfo('Europe/Kaliningrad')).isoformat())

          groups = call(
              'groups.getById',
              group_ids=GROUP_ID,
              fields='screen_name,is_admin,admin_level,type',
          )
          if isinstance(groups, dict):
              groups = groups.get('groups')
          print('VK_DIAG_GROUP=' + json.dumps(groups, ensure_ascii=False, sort_keys=True, separators=(',', ':')))

          for wall_filter in ('postponed', 'owner', 'suggests', 'all'):
              response = call(
                  'wall.get',
                  owner_id=-GROUP_ID,
                  filter=wall_filter,
                  count=100,
                  offset=0,
              )
              collection = items(response)
              matched = [post for post in collection if MARKER in str(post.get('text') or '')]
              ids = [int(post.get('id') or 0) for post in collection[:20]]
              count = response.get('count') if isinstance(response, dict) else len(collection)
              print(f'VK_DIAG_FILTER={wall_filter}:count={count}:page_items={len(collection)}:first_ids={ids}:marker_matches={len(matched)}')
              for post in matched:
                  print('VK_DIAG_MATCH_' + wall_filter.upper() + '=' + json.dumps(summarize(post), ensure_ascii=False, sort_keys=True, separators=(',', ':')))

          by_id = call('wall.getById', posts=f'-{GROUP_ID}_{POST_ID}', extended=0)
          by_id_items = items(by_id)
          print(f'VK_DIAG_GET_BY_ID_COUNT={len(by_id_items)}')
          for post in by_id_items:
              print('VK_DIAG_GET_BY_ID=' + json.dumps(summarize(post), ensure_ascii=False, sort_keys=True, separators=(',', ':')))
          PY
