name: Social communications contract CI

on:
  push:
    branches: [main]
    paths:
      - config/social-destinations.public.json
      - contracts/social-command.schema.json
      - scripts/social_registry.py
      - scripts/telegram_publish.py
      - scripts/vk_publish.py
      - tests/test_social_registry.py
      - tests/test_social_publish_contracts.py
      - .github/workflows/social-contract-ci.yml
  pull_request:
    paths:
      - config/social-destinations.public.json
      - contracts/social-command.schema.json
      - scripts/social_registry.py
      - scripts/telegram_publish.py
      - scripts/vk_publish.py
      - tests/test_social_registry.py
      - tests/test_social_publish_contracts.py
      - .github/workflows/social-contract-ci.yml

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned adapter dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          'telethon==1.40.0'
          'requests==2.32.5'

      - name: Compile and run hermetic tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/social_registry.py \
            scripts/telegram_publish.py \
            scripts/vk_publish.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify JSON documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [
              Path('config/social-destinations.public.json'),
              Path('contracts/social-command.schema.json'),
          ]
          for path in paths:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID_JSON={path}')
          PY
