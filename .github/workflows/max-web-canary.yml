name: MAX Web canary

on:
  workflow_dispatch:
    inputs:
      message:
        description: Exact text to send to «Избранное»
        required: false
        default: Привет мир
        type: string

permissions:
  contents: read

jobs:
  send-to-saved:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAX_SESSION: ${{ secrets.MAX_SESSION }}
      MAX_MESSAGE: ${{ inputs.message || 'Привет мир' }}
      MAX_ARTIFACT_DIR: artifacts/max-web

    steps:
      - name: Verify repository Actions secret is available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAX_SESSION:-}" ]]; then
            echo "::error::MAX_SESSION is absent from Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open MAX Web and send canary message
        run: npm run max:canary

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-web-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/max-web
          if-no-files-found: warn
          retention-days: 1
