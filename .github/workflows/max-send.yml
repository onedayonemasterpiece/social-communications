name: MAX deterministic staged sender
run-name: MAX staged sender — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - .github/max-live-command.json
  workflow_dispatch:
    inputs:
      command_json:
        description: Full version-2 MAX command JSON; legacy version 1 is normalized safely
        required: true
        type: string
      capture_evidence:
        description: Upload cropped one-day screenshots and DOM evidence
        required: false
        default: false
        type: boolean

concurrency:
  group: max-deterministic-staged-sender
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_SESSION: ${{ secrets.MAX_SESSION }}
      MAX_DESTINATIONS_JSON: ${{ secrets.MAX_DESTINATIONS_JSON }}
      MAX_COMMAND_JSON: ${{ github.event.inputs.command_json }}
      MAX_COMMAND_FILE: .github/max-live-command.json
      MAX_CAPTURE_EVIDENCE: ${{ inputs.capture_evidence == true && '1' || '0' }}
      MAX_ARTIFACT_DIR: artifacts/max-send
    steps:
      - name: Verify session secret
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${MAX_SESSION:-}" ]] || { echo "::error::Repository secret MAX_SESSION is absent."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install poster dependency
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'

      - name: Validate source syntax
        run: |
          npm run max:session:syntax
          python -m py_compile scripts/generate_amber_combine_poster.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate private deterministic test image
        run: npm run max:test-image

      - name: Generate approved amber-combine poster
        run: python scripts/generate_amber_combine_poster.py generated/amber-combine-poster.png

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute recipient-invisible staged MAX command
        run: npm run max:send

      - name: Upload short-lived cropped evidence
        if: always() && env.MAX_CAPTURE_EVIDENCE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: max-send-${{ github.run_id }}
          path: artifacts/max-send
          if-no-files-found: error
          retention-days: 1
