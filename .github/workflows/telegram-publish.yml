name: Telegram deterministic publisher
run-name: Telegram publisher — ${{ github.event_name }}

on:
  push:
    branches: [main]
    paths:
      - .github/telegram-live-command.json
  workflow_dispatch:
    inputs:
      command_json:
        description: Full Social Communications command JSON for platform=telegram
        required: true
        type: string

concurrency:
  group: social-communications-telegram-session-gh-actions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      SOCIAL_COMMAND_JSON: ${{ github.event.inputs.command_json }}
    steps:
      - name: Verify Telethon credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in TELEGRAM_AUTH_BUNDLE_GH_ACTIONS TG_API_ID TG_API_HASH; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::Repository secret ${name} is absent."
              exit 1
            }
          done

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check 'telethon==1.40.0' 'Pillow==11.3.0'

      - name: Validate sources and registry
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/social_registry.py scripts/telegram_publish.py scripts/generate_amber_combine_poster.py
          node --check scripts/social-generate-test-image.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('config/social-destinations.public.json'),
              Path('contracts/social-command.schema.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'VALID_JSON={path}')
          PY
          python scripts/social_registry.py >/dev/null

      - name: Select command without logging its contents
        id: command
        shell: bash
        run: |
          set -euo pipefail
          command_path="${RUNNER_TEMP}/telegram-command.json"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ -n "${SOCIAL_COMMAND_JSON:-}" ]] || {
              echo "::error::command_json is empty."
              exit 1
            }
            printf '%s' "${SOCIAL_COMMAND_JSON}" > "${command_path}"
          else
            cp .github/telegram-live-command.json "${command_path}"
          fi
          chmod 600 "${command_path}"
          echo "path=${command_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate deterministic private test image
        run: npm run social:test-image

      - name: Generate approved amber-combine poster
        run: python scripts/generate_amber_combine_poster.py generated/amber-combine-poster.png

      - name: Publish or verify Telegram command
        id: publish
        shell: bash
        env:
          COMMAND_PATH: ${{ steps.command.outputs.path }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/telegram-receipt.json"
          python scripts/telegram_publish.py --command "${COMMAND_PATH}" --receipt "${receipt}"
          python - "${receipt}" <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print('### Telegram publication receipt')
          print()
          print(f"- status: `{receipt['status']}`")
          print(f"- request: `{receipt['request_id']}`")
          print(f"- destination: `{receipt['destination_key']}`")
          channel = receipt.get('channel') or {}
          print(f"- channel: `{channel.get('username') or channel.get('title')}`")
          print(f"- message id: `{receipt['message_id']}`")
          if receipt.get('scheduled_at'):
              print(f"- scheduled at: `{receipt['scheduled_at']}`")
          print(f"- media: `{receipt.get('media')}`")
          PY

      - name: Remove private runtime files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/telegram-command.json" "${RUNNER_TEMP}/telegram-receipt.json"
          rm -rf generated
