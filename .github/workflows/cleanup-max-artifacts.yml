name: Cleanup MAX artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/cleanup-max-artifacts-trigger.txt

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      ARTIFACT_IDS: "8982322980 8982410204 8982454303 8982504542 8982566903 8982671179"
    steps:
      - name: Delete short-lived MAX artifacts
        shell: bash
        run: |
          set -euo pipefail
          for artifact_id in $ARTIFACT_IDS; do
            if gh api --method DELETE "repos/${REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null 2>/tmp/error; then
              echo "deleted artifact ${artifact_id}"
            elif grep -q 'HTTP 404' /tmp/error; then
              echo "artifact ${artifact_id} already absent"
            else
              cat /tmp/error >&2
              exit 1
            fi
          done
