name: Public destination title probe

on:
  push:
    branches: [main]
    paths:
      - .github/public-destination-probe-trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Resolve public Telegram titles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html
          import json
          import re
          import urllib.request

          handles = [
              "kldevents", "kenigevents", "lovekenig",
              "uhtykaliningrad", "uhtykaliningrad39", "uhty_kaliningrad",
              "uhtykgd", "uhty39", "wheretogo39", "youwillsee39",
          ]
          results = []
          for handle in handles:
              request = urllib.request.Request(
                  f"https://t.me/{handle}",
                  headers={"User-Agent": "Mozilla/5.0 social-communications-destination-probe/1.0"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      text = response.read().decode("utf-8", "replace")
                  def meta(prop):
                      patterns = [
                          rf'<meta[^>]+property=["\']{re.escape(prop)}["\'][^>]+content=["\']([^"\']*)',
                          rf'<meta[^>]+content=["\']([^"\']*)["\'][^>]+property=["\']{re.escape(prop)}["\']',
                      ]
                      for pattern in patterns:
                          match = re.search(pattern, text, flags=re.I)
                          if match:
                              return html.unescape(match.group(1)).strip()
                      return None
                  results.append({"handle": handle, "title": meta("og:title"), "description": meta("og:description")})
              except Exception as exc:
                  results.append({"handle": handle, "error": f"{type(exc).__name__}: {exc}"})
          print("TELEGRAM_PUBLIC_DESTINATIONS=" + json.dumps(results, ensure_ascii=False, separators=(",", ":")))
          PY
