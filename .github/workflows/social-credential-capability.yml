name: Social credential capability probe

on:
  push:
    branches: [main]
    paths:
      - .github/social-credential-capability-trigger.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
      VK_ACCESS_TOKEN5: ${{ secrets.VK_ACCESS_TOKEN5 }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check 'telethon==1.40.0' 'requests==2.32.5'
      - name: Inspect credential capabilities without exposing values
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import asyncio
          import base64
          import json
          import os
          import sys
          from typing import Any

          import requests
          from telethon import TelegramClient
          from telethon.sessions import StringSession

          def decode_bundle(raw: str) -> tuple[str, dict[str, Any]]:
              raw = raw.strip()
              attempts: list[tuple[str, str]] = [("json", raw)]
              for label, decoder in (
                  ("urlsafe_base64_json", base64.urlsafe_b64decode),
                  ("base64_json", base64.b64decode),
              ):
                  try:
                      padded = raw + ("=" * (-len(raw) % 4))
                      attempts.append((label, decoder(padded.encode("ascii")).decode("utf-8")))
                  except Exception:
                      pass
              for label, text in attempts:
                  try:
                      obj = json.loads(text)
                  except Exception:
                      continue
                  if isinstance(obj, dict):
                      return label, obj
              raise RuntimeError("bundle is neither JSON nor base64-encoded JSON")

          def key_paths(value: Any, prefix: str = "") -> list[str]:
              out: list[str] = []
              if isinstance(value, dict):
                  for key, child in value.items():
                      path = f"{prefix}.{key}" if prefix else str(key)
                      out.append(path)
                      out.extend(key_paths(child, path))
              elif isinstance(value, list):
                  for index, child in enumerate(value[:3]):
                      out.extend(key_paths(child, f"{prefix}[{index}]"))
              return out

          def first_value(obj: dict[str, Any], names: tuple[str, ...]) -> Any:
              lowered = {str(k).casefold(): v for k, v in obj.items()}
              for name in names:
                  if name.casefold() in lowered:
                      return lowered[name.casefold()]
              for value in obj.values():
                  if isinstance(value, dict):
                      nested = first_value(value, names)
                      if nested not in (None, ""):
                          return nested
              return None

          raw_bundle = os.environ.get("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS", "")
          if not raw_bundle:
              raise RuntimeError("TELEGRAM_AUTH_BUNDLE_GH_ACTIONS is absent")
          bundle_format, bundle = decode_bundle(raw_bundle)
          paths = sorted(set(key_paths(bundle)))
          print(f"TELEGRAM_BUNDLE_FORMAT={bundle_format}")
          print("TELEGRAM_BUNDLE_KEY_PATHS=" + ",".join(paths))

          api_id = first_value(bundle, ("api_id", "apiId", "telegram_api_id", "tg_api_id"))
          api_hash = first_value(bundle, ("api_hash", "apiHash", "telegram_api_hash", "tg_api_hash"))
          session = first_value(bundle, ("session", "session_string", "string_session", "telegram_session"))
          print(f"TELEGRAM_BUNDLE_HAS_API_ID={str(bool(api_id)).lower()}")
          print(f"TELEGRAM_BUNDLE_HAS_API_HASH={str(bool(api_hash)).lower()}")
          print(f"TELEGRAM_BUNDLE_HAS_SESSION={str(bool(session)).lower()}")

          async def telegram_probe() -> None:
              if not (api_id and api_hash and session):
                  print("TELEGRAM_AUTH_OK=false")
                  print("TELEGRAM_AUTH_REASON=incomplete_self_contained_bundle")
                  return
              kwargs = {}
              for key in ("device_model", "system_version", "app_version", "lang_code", "system_lang_code"):
                  value = first_value(bundle, (key,))
                  if value:
                      kwargs[key] = str(value)
              client = TelegramClient(StringSession(str(session)), int(api_id), str(api_hash), **kwargs)
              try:
                  await client.connect()
                  authorized = await client.is_user_authorized()
                  print(f"TELEGRAM_AUTH_OK={str(bool(authorized)).lower()}")
                  if not authorized:
                      return
                  me = await client.get_me()
                  print(f"TELEGRAM_ACCOUNT_IS_BOT={str(bool(getattr(me, 'bot', False))).lower()}")
                  targets = {
                      "kldevents",
                      "kenigevents",
                      "lovekenig",
                      "wheretogo39",
                      "youwillsee39",
                  }
                  found = []
                  async for dialog in client.iter_dialogs():
                      entity = dialog.entity
                      username = str(getattr(entity, "username", "") or "").casefold()
                      title = str(getattr(entity, "title", "") or getattr(entity, "first_name", "") or "")
                      if username in targets or any(token in title.casefold() for token in ("полюбить калининград", "ух ты, калининград")):
                          found.append({
                              "username": username,
                              "title": title,
                              "is_channel": bool(getattr(entity, "broadcast", False)),
                              "creator": bool(getattr(entity, "creator", False)),
                              "admin_rights": bool(getattr(entity, "admin_rights", None)),
                          })
                  print("TELEGRAM_MATCHES=" + json.dumps(found, ensure_ascii=False, separators=(",", ":")))
              finally:
                  await client.disconnect()

          asyncio.run(telegram_probe())

          vk_token = os.environ.get("VK_ACCESS_TOKEN5", "")
          if not vk_token:
              raise RuntimeError("VK_ACCESS_TOKEN5 is absent")
          api_version = "5.199"
          auth = requests.get(
              "https://api.vk.com/method/users.get",
              params={"access_token": vk_token, "v": api_version},
              timeout=20,
          ).json()
          print(f"VK_AUTH_OK={str('response' in auth and bool(auth.get('response'))).lower()}")
          if "error" in auth:
              print(f"VK_AUTH_ERROR_CODE={auth['error'].get('error_code')}")
              sys.exit(1)
          refs = ["klgdevents", "kenigeventsofficial", "uhtykaliningrad"]
          groups = requests.get(
              "https://api.vk.com/method/groups.getById",
              params={
                  "access_token": vk_token,
                  "v": api_version,
                  "group_ids": ",".join(refs),
                  "fields": "screen_name,is_admin,admin_level,type",
              },
              timeout=20,
          ).json()
          if "error" in groups:
              print(f"VK_GROUP_LOOKUP_OK=false")
              print(f"VK_GROUP_LOOKUP_ERROR_CODE={groups['error'].get('error_code')}")
              sys.exit(1)
          safe_groups = []
          for item in groups.get("response", {}).get("groups", groups.get("response", [])):
              safe_groups.append({
                  "id": item.get("id"),
                  "name": item.get("name"),
                  "screen_name": item.get("screen_name"),
                  "is_admin": item.get("is_admin"),
                  "admin_level": item.get("admin_level"),
                  "type": item.get("type"),
              })
          print("VK_GROUP_LOOKUP_OK=true")
          print("VK_GROUP_MATCHES=" + json.dumps(safe_groups, ensure_ascii=False, separators=(",", ":")))
          PY
