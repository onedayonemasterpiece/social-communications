name: Telegram auth bundle shape probe

on:
  push:
    branches: [main]
    paths:
      - .github/telegram-bundle-shape-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      TELEGRAM_AUTH_BUNDLE_GH_ACTIONS: ${{ secrets.TELEGRAM_AUTH_BUNDLE_GH_ACTIONS }}
    steps:
      - name: Inspect bundle structure without values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os

          raw = (os.environ.get('TELEGRAM_AUTH_BUNDLE_GH_ACTIONS') or '').strip()
          if not raw:
              raise SystemExit('BUNDLE_PRESENT=false')

          def decode(value: str):
              attempts = [('raw-json', value)]
              pad = '=' * ((4 - len(value) % 4) % 4)
              for name, fn in (
                  ('urlsafe-base64-json', base64.urlsafe_b64decode),
                  ('base64-json', base64.b64decode),
              ):
                  try:
                      attempts.append((name, fn((value + pad).encode('ascii')).decode('utf-8')))
                  except Exception:
                      pass
              for name, text in attempts:
                  try:
                      obj = json.loads(text)
                  except Exception:
                      continue
                  if isinstance(obj, dict):
                      return name, obj
              raise SystemExit('BUNDLE_DECODED=false')

          fmt, bundle = decode(raw)
          keys = sorted(str(key) for key in bundle.keys())
          print('BUNDLE_PRESENT=true')
          print('BUNDLE_DECODED=true')
          print(f'BUNDLE_FORMAT={fmt}')
          print('BUNDLE_KEYS=' + ','.join(keys))
          for key in (
              'session', 'api_id', 'api_hash', 'device_model', 'system_version',
              'app_version', 'lang_code', 'system_lang_code'
          ):
              value = bundle.get(key)
              print(f'BUNDLE_KEY_{key.upper()}_PRESENT={bool(value)}')
              if isinstance(value, str):
                  print(f'BUNDLE_KEY_{key.upper()}_LENGTH={len(value)}')
          PY
