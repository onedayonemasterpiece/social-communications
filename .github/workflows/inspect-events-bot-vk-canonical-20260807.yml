name: Inspect canonical VK implementation from events-bot-new

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-events-bot-vk-canonical-20260807.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/events-bot-new
          ref: main
          persist-credentials: false

      - name: Print only canonical VK function locations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast
          from pathlib import Path

          needles = (
              'photos.getWallUploadServer',
              'photos.saveWallPhoto',
              'wall.post',
              'publish_date',
              'post_to_vk',
              'VK_ACCESS_TOKEN5',
          )

          rows = []
          for path in sorted(Path('.').rglob('*.py')):
              if '.git' in path.parts or '__pycache__' in path.parts:
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              hits = [needle for needle in needles if needle in source]
              if not hits:
                  continue
              try:
                  tree = ast.parse(source)
              except SyntaxError:
                  continue
              for node in ast.walk(tree):
                  if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      continue
                  segment = ast.get_source_segment(source, node) or ''
                  node_hits = sorted(needle for needle in needles if needle in segment)
                  if node_hits:
                      rows.append((str(path), node.lineno, getattr(node, 'end_lineno', node.lineno), type(node).__name__, node.name, ','.join(node_hits)))
              top_level_lines = []
              for number, line in enumerate(source.splitlines(), start=1):
                  if any(needle in line for needle in needles):
                      top_level_lines.append(number)
              print(f'VK_FILE={path};HIT_LINES={top_level_lines[:40]};NEEDLES={sorted(hits)}')

          for path, start, end, kind, name, hits in sorted(set(rows)):
              print(f'VK_SCOPE={path}:{start}-{end};KIND={kind};NAME={name};NEEDLES={hits}')
          PY
