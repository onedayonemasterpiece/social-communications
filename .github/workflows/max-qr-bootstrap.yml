name: MAX QR login bootstrap
run-name: MAX QR login bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/max-qr-bootstrap-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr-login-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      MAX_SESSION: ${{ secrets.max_session || secrets.MAX_SESSION }}
      MAX_MESSAGE: Привет мир
      MAX_QR_ARTIFACT_DIR: artifacts/max-qr
      MAX_QR_WAIT_MS: '540000'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Start browser and wait for QR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$MAX_QR_ARTIFACT_DIR"
          rm -f "$MAX_QR_ARTIFACT_DIR/qr-ready" "$MAX_QR_ARTIFACT_DIR/bootstrap-exit-code"
          (
            unset RUNNER_TRACKING_ID
            nohup node scripts/max-qr-bootstrap.mjs >"$MAX_QR_ARTIFACT_DIR/bootstrap.log" 2>&1 &
            echo $! >"$MAX_QR_ARTIFACT_DIR/bootstrap.pid"
          )
          for _ in $(seq 1 75); do
            if [[ -f "$MAX_QR_ARTIFACT_DIR/qr-ready" ]]; then
              echo 'QR_READY=1'
              exit 0
            fi
            if [[ -f "$MAX_QR_ARTIFACT_DIR/bootstrap-exit-code" ]]; then
              cat "$MAX_QR_ARTIFACT_DIR/bootstrap.log"
              exit "$(cat "$MAX_QR_ARTIFACT_DIR/bootstrap-exit-code")"
            fi
            sleep 1
          done
          cat "$MAX_QR_ARTIFACT_DIR/bootstrap.log" || true
          exit 1

      - name: Upload live QR code
        uses: actions/upload-artifact@v4
        with:
          name: max-live-qr-${{ github.run_id }}
          path: |
            artifacts/max-qr/qr-login.png
            artifacts/max-qr/qr-dom.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for authentication and send
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 600); do
            if [[ -f "$MAX_QR_ARTIFACT_DIR/bootstrap-exit-code" ]]; then
              code="$(cat "$MAX_QR_ARTIFACT_DIR/bootstrap-exit-code")"
              cat "$MAX_QR_ARTIFACT_DIR/bootstrap.log"
              exit "$code"
            fi
            sleep 1
          done
          cat "$MAX_QR_ARTIFACT_DIR/bootstrap.log" || true
          exit 1

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: max-qr-final-${{ github.run_id }}
          path: artifacts/max-qr
          if-no-files-found: warn
          retention-days: 1
